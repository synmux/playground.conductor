# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - grype@0.110.0
    - actionlint@1.7.8
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.10
    - git-diff-check
    - gofmt@1.20.4
    - gokart@0.5.1
    - golangci-lint@1.64.8
    - isort@8.0.1
    - markdownlint@0.49.1
    - osv-scanner@2.2.4
    - oxipng@9.1.5
    - prettier@3.9.6
    - ruff@0.16.2
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - svgo@4.0.2
    - taplo@0.10.0
    - trivy@0.70.0
    - trufflehog@3.90.13
    - yamllint@1.38.0
  ignore:
    - paths:
        - "**/node_modules/**"
      linters:
        - ALL
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
